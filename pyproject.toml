[project]
name = "steam-save-bridge"
version = "0.1.0"
description = "Self-hosted cross-account Steam Cloud save sync service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "steampy>=1.2.0,<2",
    "requests>=2.28.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
steam-save-bridge = "steam_save_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steam_save_bridge"]
